name: Temporary guarded roster-removal repair

on:
  push:
    branches:
      - 'data/betfair-roster-removal-invalidation'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/betfair-roster-removal-invalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact guarded repair
        run: python tools/_apply_roster_removal_patch.py
      - name: Qualify targeted data truth
        run: |
          python -m pip install -e .
          python -m unittest tests.test_betfair_available_back_import -v
          python -m unittest tests.test_price_truth -v
      - name: Commit repaired lineage and remove temporary staging files
        shell: bash
        run: |
          rm .github/workflows/_autofix_roster_removal.yml tools/_apply_roster_removal_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/autosport/betfair_historical_import.py src/autosport/price_truth.py tests/test_betfair_available_back_import.py .github/workflows/_autofix_roster_removal.yml tools/_apply_roster_removal_patch.py
          git commit -m 'DATA: invalidate quotes removed from authoritative runner roster'
          git push origin HEAD:data/betfair-roster-removal-invalidation
