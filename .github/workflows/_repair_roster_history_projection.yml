name: Temporary roster-history projection repair

on:
  push:
    branches:
      - 'hotfix/betfair-roster-cache-invalidation'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/betfair-roster-cache-invalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact projection repair
        run: python tools/_repair_roster_history_projection.py
      - name: Qualify roster-removal truth
        run: |
          python -m pip install -e .
          python -m unittest tests.test_betfair_roster_cache_invalidation -v
          python -m unittest tests.test_betfair_available_back_import -v
      - name: Commit repaired lineage and remove temporary staging files
        shell: bash
        run: |
          rm .github/workflows/_repair_roster_history_projection.yml tools/_repair_roster_history_projection.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/autosport/betfair_historical_import.py src/autosport/price_truth.py tests/test_betfair_roster_cache_invalidation.py .github/workflows/_repair_roster_history_projection.yml tools/_repair_roster_history_projection.py
          git commit -m 'DATA: preserve authoritative runner-removal invalidation history'
          git push origin HEAD:hotfix/betfair-roster-cache-invalidation
