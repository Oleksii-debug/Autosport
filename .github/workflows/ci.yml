name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'WINDOWS_START_HERE.txt'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # Draft/closed PRs are not integration-capable; preserve the exact heavy gate
    # while skipped lifecycle runs displace obsolete work through concurrency.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AUTOSPORT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact pristine source checkout before CI
        run: python scripts/verify_source_checkout.py --source-sha "${{ env.AUTOSPORT_SOURCE_SHA }}"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v tests
      - name: Capture Windows accessibility failure evidence
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from autosport.accessibility_audit import run_accessibility_audit; from autosport.windows_layout import install_compact_windows_layout; install_compact_windows_layout(); run_accessibility_audit('ci-accessibility-audit.json')"
      - name: Upload Windows accessibility failure evidence
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Autosport-CI-Windows-accessibility-${{ matrix.python-version }}
          path: ci-accessibility-audit.json
          if-no-files-found: ignore
      - run: python -m autosport demo
