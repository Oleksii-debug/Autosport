name: Endurance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    paths:
      - 'src/autosport/endurance.py'
      - 'src/autosport/providers.py'
      - 'src/autosport/ingestion.py'
      - 'src/autosport/ingestion_health.py'
      - 'src/autosport/market_bus.py'
      - 'src/autosport/storage.py'
      - 'src/autosport/replay.py'
      - 'src/autosport/paper.py'
      - 'src/autosport/settlement.py'
      - 'src/autosport/domain.py'
      - 'src/autosport/integrity.py'
      - 'src/autosport/session.py'
      - 'src/autosport/run_registry.py'
      - 'src/autosport/run_transaction.py'
      - 'src/autosport/recovery.py'
      - 'src/autosport/recovery_worker.py'
      - 'src/autosport/cli.py'
      - 'src/autosport/causal_collector.py'
      - 'src/autosport/causal_collector_legacy.py'
      - 'src/autosport/collector_retention.py'
      - 'src/autosport/collector_service.py'
      - 'src/autosport/collector_sqlite_active_store.py'
      - 'src/autosport/collector_sqlite_bounded_storage.py'
      - 'src/autosport/collector_sqlite_store.py'
      - 'src/autosport/workspace_lock.py'
      - 'tests/test_endurance.py'
      - 'tests/test_collector_endurance_composition.py'
      - 'tests/test_causal_collector.py'
      - 'tests/test_collector_retention_compaction.py'
      - 'tests/test_collector_sqlite_storage_budget.py'
      - 'tests/test_collector_sqlite_storage_budget_race.py'
      - 'tests/test_transaction_recovery.py'
      - 'tests/test_recovery_reconciliation.py'
      - 'pyproject.toml'
      - '.github/workflows/endurance.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Coalesce only scheduler-safe classes before runner allocation. Fresh integration-capable
# events share one QUALIFY lane; draft/closed events use a separate LIFECYCLE lane and
# cannot evict useful qualification. Re-runs are isolated by exact event head SHA.
# The trusted supersession controller and read-only admission helper retain live truth
# authority; workflow-dispatch runs keep ordinary branch/ref coalescing behavior.
concurrency:
  group: endurance-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.run_attempt != 1 && format('rerun-{0}', github.event.pull_request.head.sha) || ((github.event.action == 'converted_to_draft' || github.event.action == 'closed') && 'lifecycle' || 'qualify')) || github.ref }}
  cancel-in-progress: true

jobs:
  superseded_run_admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current_head: ${{ steps.lifecycle.outputs.current_head || steps.admission.outputs.current_head }}
    steps:
      - name: Admit non-PR and closed lifecycle events without PR checkout
        if: github.event_name != 'pull_request' || github.event.action == 'closed'
        id: lifecycle
        run: echo "current_head=true" >> "$GITHUB_OUTPUT"
      - name: Checkout exact PR head for read-only admission helper
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reject stale or non-integration-capable PR head before endurance allocation
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/cancel_superseded_pr_workflow_runs.py
          --pr-number "${{ github.event.pull_request.number }}"
          --event-head-sha "${{ github.event.pull_request.head.sha }}"
          --workflow-name "${{ github.workflow }}"
          --current-run-id "${{ github.run_id }}"
          --admission-only

  endurance:
    needs: superseded_run_admission
    # Draft/closed/stale PR runs do not qualify. Scheduler partitioning only coalesces
    # equivalent qualification or lifecycle work; admission still re-resolves exact
    # live PR state/head before the matrix can allocate.
    if: >-
      needs.superseded_run_admission.outputs.current_head == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false))
    name: endurance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSPORT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify exact pristine source checkout before endurance
        run: python scripts/verify_source_checkout.py --source-sha "${{ env.AUTOSPORT_SOURCE_SHA }}"
      - name: Install Autosport
        run: python -m pip install -e .
      - name: Install collector endurance test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Run bounded endurance gate
        run: python -m autosport endurance --workspace .autosport-endurance --events 20000 --quote-keys 2000 --batch-size 500 --restart-cycles 3 --tickets 50 --output endurance-report.json
      - name: Run collector composed endurance gate
        run: >-
          python -m pytest -q
          tests/test_collector_endurance_composition.py
          tests/test_causal_collector.py::CollectorDeltaTests::test_checkpoint_ack_refreshes_state_after_serialization_boundary
          tests/test_causal_collector.py::CollectorDeltaTests::test_consumer_rechecks_peer_ack_after_serialization_boundary
      - name: Upload endurance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: endurance-${{ runner.os }}
          path: endurance-report.json
          if-no-files-found: ignore
