name: Endurance

on:
  pull_request:
  workflow_dispatch:

jobs:
  endurance:
    name: endurance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Autosport
        run: python -m pip install -e .
      - name: Run bounded endurance gate
        run: python -m autosport endurance --workspace .autosport-endurance --events 20000 --quote-keys 200 --batch-size 500 --restart-cycles 3 --tickets 50 --output endurance-report.json
      - name: Upload endurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-${{ runner.os }}
          path: endurance-report.json
          if-no-files-found: ignore
