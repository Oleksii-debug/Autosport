name: PAPER agent loss-guard comparison

on:
  push:
    branches:
      - experiment/paper-loss-guard-comparison-20261027
    paths:
      - src/autosport/paper_live_sandbox_campaign.py
      - src/autosport/paper_loss_guard_experiment.py
      - scripts/compare_paper_loss_guard.py
      - examples/paper_loss_guard_comparison.json
      - tests/test_paper_loss_guard_experiment.py
      - .github/workflows/paper-loss-guard-comparison.yml

permissions:
  contents: read

concurrency:
  group: paper-loss-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-paper-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install tested source
        run: python -m pip install -e '.[test]'
      - name: Verify decision causality and memory recovery
        run: >-
          python -m pytest -q tests/test_paper_loss_guard_experiment.py
          tests/test_paper_live_sandbox_campaign.py
          tests/test_recorded_match_price_benchmark.py
          tests/test_recorded_value_agent.py
      - name: Freeze source and independent authority
        shell: bash
        run: |
          mkdir -p paper-agent-comparison
          git rev-parse HEAD > paper-agent-comparison/source-sha.txt
          echo "AUTOSPORT_PAPER_EXECUTION_WITNESS_DIR=${RUNNER_TEMP}/loss-guard-authority-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Collect fixed stream and compare both agents
        run: >-
          python scripts/compare_paper_loss_guard.py
          --workspace paper-agent-comparison
          --config examples/paper_loss_guard_comparison.json
      - name: Preserve evidence and independent restart authority
        if: always()
        shell: bash
        run: |
          if [ -d "$AUTOSPORT_PAPER_EXECUTION_WITNESS_DIR" ]; then
            mkdir -p paper-agent-comparison/independent-authority-export
            cp -R "$AUTOSPORT_PAPER_EXECUTION_WITNESS_DIR"/. paper-agent-comparison/independent-authority-export/
          fi
      - name: Upload results including failed or incomplete experiments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-agent-comparison-${{ github.run_id }}
          path: paper-agent-comparison
          if-no-files-found: error
          retention-days: 30
