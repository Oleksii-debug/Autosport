name: Plan 5 systematic QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/plan5_qa_matrix.py'
      - 'tests/test_plan5_qa_matrix.py'
      - '.github/workflows/plan5-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

# Exact-head lanes never treat a stale branch or fork workflow as approval.
concurrency:
  group: plan5-qa-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.number, github.event.pull_request.head.sha) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  systematic_qa:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      AUTOSPORT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact pristine checkout
        run: python scripts/verify_source_checkout.py --source-sha "${{ env.AUTOSPORT_SOURCE_SHA }}"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Plan 5 cross-authority falsifier families
        run: python scripts/plan5_qa_matrix.py --source-sha "${{ env.AUTOSPORT_SOURCE_SHA }}" --output plan5-qa-evidence.json
      - name: Preserve bounded secret-free evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan5-qa-${{ runner.os }}
          path: plan5-qa-evidence.json
          if-no-files-found: ignore
