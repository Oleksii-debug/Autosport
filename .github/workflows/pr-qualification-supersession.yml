name: PR qualification supersession controller

on:
  workflow_run:
    workflows: [CI, Windows candidate, Endurance]
    types: [requested]

# This workflow is deliberately trusted/default-branch-owned. PR-head workflows keep
# read-only permissions; only this controller may cancel obsolete qualification runs.
permissions:
  actions: write
  contents: read
  pull-requests: read

# Keep only the newest trusted cancellation decision for one PR + source workflow.
# Controllers for CI, Windows candidate, and Endurance must not preempt one another,
# because each invocation cancels only obsolete runs of its own source workflow.
# Replacing an older same-workflow controller cannot grant cancellation authority:
# every irreversible cancellation is still guarded by a fresh live head/state/draft
# snapshot inside the trusted helper.
concurrency:
  group: pr-qualification-supersession-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: true

jobs:
  cancel_superseded_head_runs:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch controller code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Cancel obsolete-head runs for this PR and workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/cancel_superseded_pr_workflow_runs.py
          --pr-number "${{ github.event.workflow_run.pull_requests[0].number }}"
          --event-head-sha "${{ github.event.workflow_run.head_sha }}"
          --workflow-name "${{ github.event.workflow_run.name }}"
          --current-run-id "${{ github.event.workflow_run.id }}"
