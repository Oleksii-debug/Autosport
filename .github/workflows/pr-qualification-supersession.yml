name: PR qualification supersession controller

on:
  workflow_run:
    workflows: [CI, Windows candidate, Endurance]
    types: [requested]

# This workflow is deliberately trusted/default-branch-owned. PR-head workflows keep
# read-only permissions; only this controller may cancel obsolete qualification runs.
permissions:
  actions: write
  contents: read
  pull-requests: read

# Bound trusted controller work per PR + source workflow instead of per source head.
# A fast-moving PR can emit many requested workflow_run events before any controller
# receives a runner. Head-partitioned controller groups therefore amplify the very queue
# pressure this workflow exists to reduce.
#
# For a singleton workflow_run.pull_requests reference, the scheduler key uses the exact
# PR number plus source workflow id. Different PRs sharing one commit and CI/Windows/
# Endurance remain isolated. Empty or multi-reference payloads have no PR scheduler
# authority and share one unresolved bucket per source workflow; coalescing that bucket
# cannot grant cancellation authority because the trusted helper still resolves identity
# and revalidates live PR state before every irreversible POST.
#
# The source head is intentionally NOT in this controller key. Any surviving controller,
# including one triggered by a delayed stale-head event, reconciles its source workflow
# against the PR's freshly read live head. cancel-in-progress stays false so a newly
# requested controller cannot kill an already-running trusted decision; GitHub may replace
# older pending work in the same group, bounding backlog while the running decision keeps
# making progress.
concurrency:
  group: pr-qualification-supersession-${{ github.event.workflow_run.pull_requests[0].number && !github.event.workflow_run.pull_requests[1].number && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || 'unresolved' }}-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  cancel_superseded_head_runs:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch controller code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Cancel obsolete-head runs for this PR and workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/cancel_superseded_pr_workflow_runs_scoped.py
          --pr-number "${{ github.event.workflow_run.pull_requests[0].number && !github.event.workflow_run.pull_requests[1].number && github.event.workflow_run.pull_requests[0].number || 0 }}"
          --event-head-sha "${{ github.event.workflow_run.head_sha }}"
          --workflow-name "${{ github.event.workflow_run.name }}"
          --workflow-id "${{ github.event.workflow_run.workflow_id }}"
          --current-run-id "${{ github.event.workflow_run.id }}"
