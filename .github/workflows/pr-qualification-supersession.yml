name: PR qualification supersession controller

on:
  workflow_run:
    workflows: [CI, Windows candidate, Endurance]
    types: [requested]

# This workflow is deliberately trusted/default-branch-owned. PR-head workflows keep
# read-only permissions; only this controller may cancel obsolete qualification runs.
permissions:
  actions: write
  contents: read
  pull-requests: read

# Keep only the newest trusted cancellation decision for one known PR + exact source
# head + source workflow. A delayed stale-head workflow_run event must never evict the
# useful current-head controller before the trusted helper can discover that the stale
# event has no cancellation authority. Exact-head partitioning preserves that scheduler
# safety while still coalescing duplicate/rerun controller work for the same head.
#
# workflow_run.pull_requests is an array. Treat its PR number as scheduler authority only
# when exactly one reference is present; an empty or multi-reference payload is unresolved
# and therefore run-unique until the trusted helper resolves the exact head to one unique
# PR. This prevents an arbitrary first array member from becoming Actions-write authority.
# In particular, two distinct PRs may point at the same exact commit, so head_sha must not
# be used as a surrogate PR key. Controllers with one explicit PR number retain same-head
# latest-wins coalescing. Controllers for CI, Windows candidate, and Endurance must not
# preempt one another, because each invocation cancels only obsolete runs of its own
# source workflow. Replacing an older same-head same-workflow controller cannot grant
# cancellation authority: every irreversible cancellation is still guarded by a fresh
# live head/state/draft snapshot inside the trusted helper. The controller also enumerates
# active runs only inside the exact workflow_id carried by workflow_run, avoiding
# repository-wide queue scans while preserving the existing PR/head cancellation filters.
concurrency:
  group: pr-qualification-supersession-${{ github.event.workflow_run.pull_requests[0].number && !github.event.workflow_run.pull_requests[1].number && github.event.workflow_run.pull_requests[0].number || format('unresolved-run-{0}', github.event.workflow_run.id) }}-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: true

jobs:
  cancel_superseded_head_runs:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch controller code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Cancel obsolete-head runs for this PR and workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/cancel_superseded_pr_workflow_runs_scoped.py
          --pr-number "${{ github.event.workflow_run.pull_requests[0].number && !github.event.workflow_run.pull_requests[1].number && github.event.workflow_run.pull_requests[0].number || 0 }}"
          --event-head-sha "${{ github.event.workflow_run.head_sha }}"
          --workflow-name "${{ github.event.workflow_run.name }}"
          --workflow-id "${{ github.event.workflow_run.workflow_id }}"
          --current-run-id "${{ github.event.workflow_run.id }}"
