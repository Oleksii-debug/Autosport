name: PR348 same-lineage birth-boundary repair

on:
  push:
    branches:
      - fix/windows-egg-info-source-integrity-346
    paths:
      - scripts/pr348_repair_once.py
      - .github/workflows/pr348-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact same-lineage repair
        run: python scripts/pr348_repair_once.py
      - name: Static syntax
        run: python -m py_compile scripts/guarded_release_creator_launch.py
      - name: Focused release-boundary tests
        run: python -m pytest -q tests/test_windows_creator_host_bootstrap.py tests/test_windows_pyinstaller_orchestrator_birth_boundary.py
      - name: Commit same-lineage repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_windows.ps1 scripts/guarded_release_creator_launch.py scripts/guarded_pyinstaller_orchestrator_boundary.cs tests/test_windows_creator_host_bootstrap.py tests/test_windows_pyinstaller_orchestrator_birth_boundary.py
          if git diff --cached --quiet; then
            echo "No repair delta"
            exit 0
          fi
          git commit -m "fix(release): birth-protect Windows creator before release logic"
          git push origin HEAD:fix/windows-egg-info-source-integrity-346
