name: PR348 same-lineage birth-boundary repair

on:
  push:
    branches:
      - fix/windows-egg-info-source-integrity-346
    paths:
      - scripts/pr348_repair_once.py
      - .github/workflows/pr348-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact same-lineage repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr348_repair_once.py')
          text = path.read_text(encoding='utf-8')
          old = "            string nonce =\n'''"
          new = "            string nonce = Guid.NewGuid().ToString(\"N\") + Guid.NewGuid().ToString(\"N\");\n'''"
          if text.count(old) != 2:
              raise SystemExit(f'one-shot nonce anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python scripts/pr348_repair_once.py
          python - <<'PY'
          from pathlib import Path

          launcher = Path('scripts/guarded_release_creator_launch.py')
          text = launcher.read_text(encoding='utf-8')
          old = r'barrier_name = "Local\AutosportReleaseCreator-"'
          new = r'barrier_name = r"Local\AutosportReleaseCreator-"'
          if text.count(old) != 1:
              raise SystemExit(f'generated barrier-name anchor count: {text.count(old)}')
          launcher.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          creator_test = Path('tests/test_windows_creator_host_bootstrap.py')
          text = creator_test.read_text(encoding='utf-8')
          old = 'assert "creator-host build body blob is not the reviewed predecessor body" in fence_bootstrap'
          new = 'assert "build body blob is not the reviewed predecessor body" in fence_bootstrap'
          if text.count(old) != 1:
              raise SystemExit(f'creator-test message anchor count: {text.count(old)}')
          creator_test.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          orchestrator_test = Path('tests/test_windows_pyinstaller_orchestrator_birth_boundary.py')
          text = orchestrator_test.read_text(encoding='utf-8')
          old = '_BUILD_SCRIPT = _ROOT / "scripts" / "build_windows.ps1"'
          new = '_BUILD_SCRIPT = _ROOT / "scripts" / "build_windows_body.ps1"'
          if text.count(old) != 1:
              raise SystemExit(f'orchestrator-test build-body anchor count: {text.count(old)}')
          orchestrator_test.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Static syntax
        run: python -W error -m py_compile scripts/guarded_release_creator_launch.py
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Focused release-boundary tests
        run: python -m pytest -q tests/test_windows_creator_host_bootstrap.py tests/test_windows_pyinstaller_orchestrator_birth_boundary.py
      - name: Commit same-lineage repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_windows.ps1 scripts/guarded_release_creator_launch.py scripts/guarded_pyinstaller_orchestrator_boundary.cs tests/test_windows_creator_host_bootstrap.py tests/test_windows_pyinstaller_orchestrator_birth_boundary.py
          if git diff --cached --quiet; then
            echo "No repair delta"
            exit 0
          fi
          git commit -m "fix(release): birth-protect Windows creator before release logic"
          git push origin HEAD:fix/windows-egg-info-source-integrity-346