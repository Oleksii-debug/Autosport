name: Recorded outcomes and shadow agent learning

on:
  push:
    branches:
      - work/agent-shadow-learning-20261027
    paths:
      - src/autosport/shadow_strategy_memory.py
      - src/autosport/prospective_shadow_observer.py
      - scripts/run_prospective_shadow_observer.py
      - examples/prospective_shadow_observer.json
      - .github/workflows/prospective-shadow-observer.yml

permissions:
  contents: read

concurrency:
  group: prospective-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-shadow-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source
        run: python -m pip install -e '.[test]'
      - name: Check chronology, recovery and actual result feedback
        run: >-
          python -m pytest -q tests/test_shadow_strategy_memory.py
          tests/test_prospective_shadow_observer.py tests/test_recorded_shadow_memory.py
          tests/test_recorded_cross_book_value.py
      - name: Record source and attribution
        run: |
          mkdir -p prospective-shadow-evidence
          git rev-parse HEAD > prospective-shadow-evidence/source-sha.txt
          printf '%s\n' 'TipsAudit https://tipsaudit.com/api and https://tipsaudit.com/data; free with attribution; no accepted bets or real-money execution.' > prospective-shadow-evidence/ATTRIBUTION.txt
      - name: Collect and learn from later recorded outcomes for four hours
        run: >-
          python scripts/run_prospective_shadow_observer.py
          --workspace prospective-shadow-evidence
          --config examples/prospective_shadow_observer.json
          --cycles 49 --interval-seconds 300
      - name: Retain raw public snapshots and learner checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prospective-shadow-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: prospective-shadow-evidence
          retention-days: 30
          if-no-files-found: error
