name: Outcome-seeded shadow challenger
on:
  push:
    branches:
      - research/seeded-shadow-20261028
permissions:
  contents: read
  actions: read
concurrency:
  group: seeded-shadow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  segment-1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source
        run: python -m pip install -e '.[test]'
      - name: Verify seed, chronology, continuity and economic accounting
        run: >-
          python -m pytest -q tests/test_run_seeded_shadow.py tests/test_initialize_seeded_shadow.py
          tests/test_recorded_live_flags.py tests/test_recorded_paper_projection.py
          tests/test_prospective_shadow_observer.py tests/test_shadow_strategy_memory.py
      - name: Restore exact earlier seeded state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_seeded_initial.py --workspace seeded-shadow-evidence
      - name: Record source and attribution
        run: |
          git rev-parse HEAD > seeded-shadow-evidence/source-sha.txt
          printf '%s\n' 'TipsAudit https://tipsaudit.com/api and https://tipsaudit.com/data; free with attribution; no accepted bets or real-money execution.' > seeded-shadow-evidence/ATTRIBUTION.txt
      - name: Learn from subsequent recorded outcomes for four hours
        run: >-
          python scripts/run_seeded_shadow.py --workspace seeded-shadow-evidence
          --cycles 49 --interval-seconds 300
      - name: Retain seeded memory and public source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seeded-shadow-${{ github.run_id }}-attempt-${{ github.run_attempt }}-segment-1
          path: seeded-shadow-evidence
          retention-days: 30
          if-no-files-found: error
