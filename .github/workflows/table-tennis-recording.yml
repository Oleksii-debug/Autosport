name: Record twenty table-tennis matches for replay
on:
  push:
    branches:
      - research/table-tennis-replay-20261028
    paths:
      - experiments/table_tennis_replay/record.py
      - experiments/table_tennis_replay/initial-selection.json
      - .github/workflows/table-tennis-recording.yml
permissions:
  contents: write
concurrency:
  group: table-tennis-recording-20261028
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify 3-minute samples and source identity rules
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_table_tennis_recording.py
      - name: Record and publish progress on the isolated data branch
        shell: bash
        run: |
          git config user.name 'Autosport research recorder'
          git config user.email 'autosport-research@users.noreply.github.com'
          git checkout -b data/table-tennis-capture-20261028
          python -u experiments/table_tennis_replay/record.py \
            --selection experiments/table_tennis_replay/initial-selection.json \
            --output experiments/table_tennis_replay/recording.json --max-seconds 16200 &
          recorder_pid=$!
          publish_recording() {
            if [ -s experiments/table_tennis_replay/recording.json ]; then
              git add experiments/table_tennis_replay/recording.json
              if ! git diff --cached --quiet; then
                git commit -m 'data: preserve table tennis recording progress' || return 1
              fi
              git push origin HEAD:refs/heads/data/table-tennis-capture-20261028 || return 1
            fi
          }
          while kill -0 "$recorder_pid" 2>/dev/null; do
            publish_recording || echo 'Progress publication unavailable; recording continues and final artifact will be retained.'
            sleep 180
          done
          recorder_status=0
          wait "$recorder_pid" || recorder_status=$?
          publish_recording || echo 'Final publication unavailable; final artifact remains authoritative.'
          exit "$recorder_status"
      - name: Retain the recording and source selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: table-tennis-recording-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            experiments/table_tennis_replay/initial-selection.json
            experiments/table_tennis_replay/recording.json
          retention-days: 30
          if-no-files-found: error
