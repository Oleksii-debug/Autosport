name: Windows candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'WINDOWS_START_HERE.txt'
      - 'scripts/build_windows.ps1'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Autosport-V1-Windows-prehuman
          path: dist/Autosport-V1-windows-x64.zip
          if-no-files-found: error
