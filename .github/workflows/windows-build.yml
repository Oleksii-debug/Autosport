name: Windows candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'WINDOWS_START_HERE.txt'
      - 'scripts/**'
      - '.gitattributes'
      - '.github/workflows/windows-build.yml'

concurrency:
  group: windows-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      AUTOSPORT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact pristine source checkout before build
        shell: pwsh
        run: python scripts/verify_source_checkout.py --source-sha $env:AUTOSPORT_SOURCE_SHA
      - name: Build Windows candidate and retain producer-bound package digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $producerPackageDigests = [System.Collections.Generic.List[string]]::new()
          & ./scripts/build_windows.ps1 2>&1 | ForEach-Object {
            $line = [string]$_
            Write-Host $line
            if ($line -match '^SHA256=([0-9a-f]{64})$') {
              [void]$producerPackageDigests.Add($Matches[1])
            }
          }
          if ($producerPackageDigests.Count -ne 1) {
            throw "Windows build must emit exactly one producer-bound final package SHA-256; found $($producerPackageDigests.Count)"
          }
          $producerPackageSha = $producerPackageDigests[0]
          "AUTOSPORT_PRODUCER_PACKAGE_SHA256=$producerPackageSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Materialize verified independent package extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-ProducerPackageDigest {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][string]$Expected,
              [Parameter(Mandatory=$true)][string]$Label
            )
            if (-not (Test-Path $Path -PathType Leaf)) { throw "$Label is missing: $Path" }
            if ($Expected -notmatch '^[0-9a-f]{64}$') { throw "$Label expected producer SHA-256 is not canonical" }
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected) { throw "$Label SHA-256 mismatch: expected producer $Expected, got $actual" }
            return $actual
          }

          $package = Join-Path $PWD 'dist/Autosport-V1-windows-x64.zip'
          $verificationPath = Join-Path $PWD 'dist/fresh-extraction-verification.json'
          if (-not (Test-Path $package -PathType Leaf)) { throw 'Independent package extraction is missing release ZIP' }
          if (-not (Test-Path $verificationPath -PathType Leaf)) { throw 'Independent package extraction is missing canonical fresh verification' }

          $producerPackageSha = [string]$env:AUTOSPORT_PRODUCER_PACKAGE_SHA256
          if ($producerPackageSha -notmatch '^[0-9a-f]{64}$') { throw 'Independent package extraction is missing canonical producer-bound package SHA-256' }

          # Adversarial regression: a coordinated replacement can make a mutable ZIP
          # and mutable verification JSON agree with each other. It must still lose
          # against the earlier producer-bound digest before that JSON is trusted.
          $handoffProbeRoot = Join-Path $env:RUNNER_TEMP 'autosport-producer-consumer-handoff-probe'
          $probePackage = Join-Path $handoffProbeRoot 'Autosport-V1-windows-x64.zip'
          $probeVerificationPath = Join-Path $handoffProbeRoot 'fresh-extraction-verification.json'
          try {
            if (Test-Path $handoffProbeRoot) { Remove-Item -LiteralPath $handoffProbeRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $handoffProbeRoot | Out-Null
            [System.IO.File]::WriteAllText($probePackage, 'COORDINATED_REPLACEMENT_PACKAGE', [System.Text.Encoding]::UTF8)
            $forgedPackageSha = (Get-FileHash -LiteralPath $probePackage -Algorithm SHA256).Hash.ToLowerInvariant()
            $forgedVerification = [ordered]@{
              status = 'PASS'
              source_sha = $env:AUTOSPORT_SOURCE_SHA
              package_sha256 = $forgedPackageSha
              real_money_execution = $false
              human_tested = $false
              nvda_verified = $false
            }
            $forgedVerification | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $probeVerificationPath -Encoding utf8
            $probeEvidence = Get-Content $probeVerificationPath -Raw | ConvertFrom-Json
            if ([string]$probeEvidence.package_sha256 -ne $forgedPackageSha) { throw 'Coordinated replacement probe JSON did not self-consistently forge package digest' }

            $probeRejected = $false
            try {
              [void](Assert-ProducerPackageDigest -Path $probePackage -Expected $producerPackageSha -Label 'Coordinated producer handoff replacement probe')
            } catch {
              $probeRejected = $true
            }
            if (-not $probeRejected) { throw 'Producer-bound digest gate accepted coordinated ZIP + verification JSON replacement' }
          } finally {
            Remove-Item -LiteralPath $handoffProbeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

          # This comparison is intentionally before the first read of the mutable
          # verification JSON. The producer digest crossed the previous step in
          # runner-managed environment state, so ZIP+JSON cannot redefine it here.
          $packageSha = Assert-ProducerPackageDigest -Path $package -Expected $producerPackageSha -Label 'Release ZIP at producer-to-consumer handoff'
          $verification = Get-Content $verificationPath -Raw | ConvertFrom-Json
          if ($verification.status -ne 'PASS') { throw 'Canonical fresh extraction is not PASS before independent package extraction' }
          if ([string]$verification.source_sha -ne [string]$env:AUTOSPORT_SOURCE_SHA) { throw 'Canonical fresh extraction source_sha does not match exact workflow head' }
          if ([string]$verification.package_sha256 -ne $packageSha) { throw 'Release ZIP digest drifted after canonical fresh extraction' }

          $postPackageExtractRoot = Join-Path $PWD '.build-post-package-extraction'
          if (Test-Path $postPackageExtractRoot) { Remove-Item -Recurse -Force $postPackageExtractRoot }
          New-Item -ItemType Directory -Path $postPackageExtractRoot | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $postPackageExtractRoot -Force
          $postPackageRoot = Join-Path $postPackageExtractRoot 'Autosport-V1'
          $buildInfoPath = Join-Path $postPackageRoot 'BUILD_INFO.json'
          $packagedExe = Join-Path $postPackageRoot 'Autosport.exe'
          $packagedDataExe = Join-Path $postPackageRoot 'Autosport-Data.exe'
          foreach ($required in @($buildInfoPath, $packagedExe, $packagedDataExe)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Independent package extraction is missing required artifact: $required" }
          }

          $buildInfo = Get-Content $buildInfoPath -Raw | ConvertFrom-Json
          if ([string]$buildInfo.source_sha -ne [string]$env:AUTOSPORT_SOURCE_SHA) { throw 'Independent package BUILD_INFO source_sha mismatch' }
          if ($buildInfo.real_money_execution -ne $false -or $buildInfo.human_tested -ne $false -or $buildInfo.nvda_verified -ne $false) {
            throw 'Independent package extraction violated prehuman truth labels'
          }
          $packagedExeSha = (Get-FileHash -LiteralPath $packagedExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $packagedDataExeSha = (Get-FileHash -LiteralPath $packagedDataExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packagedExeSha -ne [string]$buildInfo.autosport_exe_sha256) { throw 'Independent package Autosport.exe hash mismatch' }
          if ($packagedDataExeSha -ne [string]$buildInfo.autosport_data_exe_sha256) { throw 'Independent package Autosport-Data.exe hash mismatch' }
          if ($packagedExeSha -ne [string]$verification.autosport_exe_sha256) { throw 'Independent package Autosport.exe drifted from canonical fresh extraction' }
          if ($packagedDataExeSha -ne [string]$verification.autosport_data_exe_sha256) { throw 'Independent package Autosport-Data.exe drifted from canonical fresh extraction' }

          "AUTOSPORT_PACKAGED_ROOT=$postPackageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AUTOSPORT_PACKAGED_EXE=$packagedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AUTOSPORT_PACKAGED_DATA_EXE=$packagedDataExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AUTOSPORT_QUALIFIED_PACKAGE_SHA256=$packageSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Execute packaged NVDA evidence contract
        shell: pwsh
        run: ./scripts/nvda_evidence_package_smoke.ps1
      - name: Prove packaged workspace recovery reachability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packagedDataExe = [string]$env:AUTOSPORT_PACKAGED_DATA_EXE
          $freshDataExe = Join-Path $PWD '.build-fresh-extraction/Autosport-V1/Autosport-Data.exe'
          if ([string]::IsNullOrWhiteSpace($packagedDataExe)) { throw 'Packaged recovery smoke is missing verified package executable anchor' }
          if (-not (Test-Path $packagedDataExe -PathType Leaf)) { throw 'Packaged recovery smoke is missing Autosport-Data.exe' }
          if (-not (Test-Path $freshDataExe -PathType Leaf)) { throw 'Fresh-extracted recovery smoke is missing Autosport-Data.exe' }

          $packagedWorkspace = Join-Path $PWD 'dist/repair-workspace-packaged-smoke'
          $freshWorkspace = Join-Path $PWD 'dist/repair-workspace-fresh-smoke'
          foreach ($workspace in @($packagedWorkspace, $freshWorkspace)) {
            if (Test-Path $workspace) { Remove-Item -Recurse -Force $workspace }
            New-Item -ItemType Directory -Path $workspace | Out-Null
          }

          $packagedOutput = (& $packagedDataExe repair-workspace --workspace $packagedWorkspace 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Packaged Autosport-Data.exe repair-workspace exited $LASTEXITCODE" }
          if ($packagedOutput -notmatch 'repair=OK') { throw 'Packaged repair-workspace did not report canonical repair=OK' }

          $freshOutput = (& $freshDataExe repair-workspace --workspace $freshWorkspace 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Fresh-extracted Autosport-Data.exe repair-workspace exited $LASTEXITCODE" }
          if ($freshOutput -notmatch 'repair=OK') { throw 'Fresh-extracted repair-workspace did not report canonical repair=OK' }

          $evidence = [ordered]@{
            status = 'PASS'
            source_sha = $env:AUTOSPORT_SOURCE_SHA
            packaged_repair_workspace_status = 'PASS'
            fresh_extracted_repair_workspace_status = 'PASS'
            canonical_output = 'repair=OK'
            empty_isolated_workspace_reachability_only = $true
            real_money_execution = $false
            human_tested = $false
            nvda_verified = $false
          }
          $evidencePath = Join-Path $PWD 'dist/repair-workspace-package-smoke.json'
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $evidencePath -Encoding utf8

          $verificationPath = Join-Path $PWD 'dist/fresh-extraction-verification.json'
          $verification = Get-Content $verificationPath -Raw | ConvertFrom-Json
          $verification | Add-Member -NotePropertyName extracted_repair_workspace_status -NotePropertyValue 'PASS' -Force
          $verification | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $verificationPath -Encoding utf8
      - name: Execute packaged walk-forward evaluation
        shell: pwsh
        run: ./scripts/walk_forward_package_smoke.ps1
      - name: Execute packaged retrospective forecast-origin evaluation
        shell: pwsh
        run: ./scripts/walk_forward_origin_package_smoke.ps1
      - name: Audit packaged research demo path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packagedRoot = [string]$env:AUTOSPORT_PACKAGED_ROOT
          $packagedExe = [string]$env:AUTOSPORT_PACKAGED_EXE
          if ([string]::IsNullOrWhiteSpace($packagedRoot) -or [string]::IsNullOrWhiteSpace($packagedExe)) {
            throw 'Packaged research demo audit is missing verified package extraction anchors'
          }
          $packagedDemo = Join-Path $packagedRoot 'examples/tt_demo'
          if (-not (Test-Path $packagedExe -PathType Leaf)) { throw 'Packaged research demo audit is missing Autosport.exe' }
          if (-not (Test-Path (Join-Path $packagedDemo 'research_plan.json') -PathType Leaf)) { throw 'Packaged research demo audit is missing shipped research plan' }

          $preAudit = Join-Path $PWD 'dist/research-demo-audit.json'
          if (Test-Path $preAudit) { Remove-Item -Force $preAudit }
          $preProcess = Start-Process -FilePath $packagedExe -ArgumentList '--research-demo-audit-output', $preAudit, $packagedDemo -Wait -PassThru
          if ($preProcess.ExitCode -ne 0) { throw "Packaged research demo audit exited $($preProcess.ExitCode)" }
          $preEvidence = Get-Content $preAudit -Raw | ConvertFrom-Json
          if ($preEvidence.status -ne 'PASS') { throw 'Packaged research demo audit did not PASS' }
          if ($preEvidence.strategy_id -ne 'research-replay-v1') { throw 'Packaged research demo audit strategy mismatch' }
          if ($preEvidence.replay_event_count -ne 4 -or $preEvidence.settled_ticket_count -ne 1 -or $preEvidence.persistent_ticket_count -ne 1) {
            throw 'Packaged research demo audit product journey drifted'
          }
          if ($preEvidence.persistent_balance -ne '990' -or $preEvidence.paper_net_profit -ne '-10') {
            throw 'Packaged research demo audit economic result drifted'
          }
          if ($preEvidence.sample_fixture -ne $true -or $preEvidence.real_historical_market_proof -ne $false -or $preEvidence.profitability_claim -ne $false) {
            throw 'Packaged research demo audit violated sample/historical truth boundary'
          }
          if ($preEvidence.real_money_execution -ne $false -or $preEvidence.human_tested -ne $false -or $preEvidence.nvda_verified -ne $false) {
            throw 'Packaged research demo audit violated release truth labels'
          }

          $freshRoot = Join-Path $PWD '.build-fresh-extraction/Autosport-V1'
          $freshExe = Join-Path $freshRoot 'Autosport.exe'
          $freshDemo = Join-Path $freshRoot 'examples/tt_demo'
          if (-not (Test-Path $freshExe -PathType Leaf)) { throw 'Fresh extraction is missing Autosport.exe for research demo audit' }
          if (-not (Test-Path (Join-Path $freshDemo 'research_plan.json') -PathType Leaf)) { throw 'Fresh extraction is missing shipped research plan' }

          $freshAudit = Join-Path $PWD 'dist/fresh-extraction-research-demo-audit.json'
          if (Test-Path $freshAudit) { Remove-Item -Force $freshAudit }
          $freshProcess = Start-Process -FilePath $freshExe -ArgumentList '--research-demo-audit-output', $freshAudit, $freshDemo -Wait -PassThru
          if ($freshProcess.ExitCode -ne 0) { throw "Fresh-extracted research demo audit exited $($freshProcess.ExitCode)" }
          $freshEvidence = Get-Content $freshAudit -Raw | ConvertFrom-Json
          if ($freshEvidence.status -ne 'PASS') { throw 'Fresh-extracted research demo audit did not PASS' }
          if ($freshEvidence.strategy_id -ne 'research-replay-v1') { throw 'Fresh-extracted research demo strategy mismatch' }
          if ($freshEvidence.research_plan_sha256 -ne $preEvidence.research_plan_sha256) { throw 'Research plan identity changed after packaging' }
          if ($freshEvidence.dataset_market_sha256 -ne $preEvidence.dataset_market_sha256 -or $freshEvidence.dataset_results_sha256 -ne $preEvidence.dataset_results_sha256) {
            throw 'Research demo dataset identity changed after packaging'
          }
          if ($freshEvidence.replay_event_count -ne $preEvidence.replay_event_count -or $freshEvidence.settled_ticket_count -ne $preEvidence.settled_ticket_count -or $freshEvidence.persistent_ticket_count -ne $preEvidence.persistent_ticket_count) {
            throw 'Research demo journey changed after fresh extraction'
          }
          if ($freshEvidence.persistent_balance -ne $preEvidence.persistent_balance -or $freshEvidence.paper_net_profit -ne $preEvidence.paper_net_profit) {
            throw 'Research demo economic result changed after fresh extraction'
          }
          if ($freshEvidence.sample_fixture -ne $true -or $freshEvidence.real_historical_market_proof -ne $false -or $freshEvidence.profitability_claim -ne $false) {
            throw 'Fresh-extracted research demo audit violated sample/historical truth boundary'
          }
          if ($freshEvidence.real_money_execution -ne $false -or $freshEvidence.human_tested -ne $false -or $freshEvidence.nvda_verified -ne $false) {
            throw 'Fresh-extracted research demo audit violated release truth labels'
          }
      - name: External UIA fresh-extraction gate
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD 'dist/fresh-extraction-external-uia-audit.json'
          ./scripts/external_uia_audit.ps1 `
            -Exe (Join-Path $PWD '.build-fresh-extraction/Autosport-V1/Autosport.exe') `
            -Output $evidence
          $external = Get-Content $evidence -Raw | ConvertFrom-Json
          if ($external.status -ne 'PASS') { throw 'External UIA fresh-extraction audit did not PASS' }
          if ($external.real_money_execution -ne $false -or $external.human_tested -ne $false -or $external.nvda_verified -ne $false) {
            throw 'External UIA audit violated release truth labels'
          }
          $verificationPath = Join-Path $PWD 'dist/fresh-extraction-verification.json'
          $verification = Get-Content $verificationPath -Raw | ConvertFrom-Json
          $verification | Add-Member -NotePropertyName extracted_external_uia_status -NotePropertyValue $external.status -Force
          $verification | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $verificationPath -Encoding utf8
      - name: Upload external UIA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Autosport-external-uia-failure-evidence
          path: dist/fresh-extraction-external-uia-audit.json
          if-no-files-found: ignore
      - name: Reprove release ZIP immediately before artifact publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-PackageDigest {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][string]$Expected,
              [Parameter(Mandatory=$true)][string]$Label
            )
            if (-not (Test-Path $Path -PathType Leaf)) { throw "$Label is missing: $Path" }
            if ($Expected -notmatch '^[0-9a-f]{64}$') { throw "$Label expected SHA-256 is not canonical" }
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected) { throw "$Label SHA-256 mismatch: expected $Expected, got $actual" }
          }

          $package = Join-Path $PWD 'dist/Autosport-V1-windows-x64.zip'
          $expected = [string]$env:AUTOSPORT_QUALIFIED_PACKAGE_SHA256
          if ([string]::IsNullOrWhiteSpace($expected)) { throw 'Publication gate is missing qualified release ZIP SHA-256' }

          $probe = Join-Path $env:RUNNER_TEMP 'autosport-publication-replacement-probe.zip'
          $replacement = "$probe.replacement"
          try {
            Copy-Item -LiteralPath $package -Destination $probe -Force
            Assert-PackageDigest -Path $probe -Expected $expected -Label 'Publication replacement probe before mutation'
            Copy-Item -LiteralPath $package -Destination $replacement -Force
            [System.IO.File]::AppendAllText($replacement, 'AUTOSPORT_PUBLICATION_REPLACEMENT', [System.Text.Encoding]::UTF8)
            Remove-Item -LiteralPath $probe -Force
            Move-Item -LiteralPath $replacement -Destination $probe

            $rejected = $false
            try {
              Assert-PackageDigest -Path $probe -Expected $expected -Label 'Publication replacement probe after mutation'
            } catch {
              $rejected = $true
            }
            if (-not $rejected) { throw 'Publication digest verifier accepted a replaced package probe' }
          } finally {
            Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $replacement -Force -ErrorAction SilentlyContinue
          }

          Assert-PackageDigest -Path $package -Expected $expected -Label 'Release ZIP immediately before artifact upload'
      - name: Upload prehuman Windows candidate
        id: upload_prehuman_candidate
        uses: actions/upload-artifact@v4
        with:
          name: Autosport-V1-Windows-prehuman
          path: |
            dist/Autosport-V1-windows-x64.zip
            dist/packaged-diagnostic.json
            dist/accessibility-audit.json
            dist/keyboard-audit.json
            dist/restart-recovery-audit.json
            dist/research-demo-audit.json
            dist/repair-workspace-package-smoke.json
            dist/walk-forward-package-smoke.json
            dist/walk-forward-package-smoke-dataset
            dist/walk-forward-package-smoke-report.json
            dist/walk-forward-origin-package-smoke.json
            dist/walk-forward-origin-package-smoke-workspace
            dist/walk-forward-origin-package-smoke-report.json
            dist/package-verification.json
            dist/fresh-extraction-diagnostic.json
            dist/fresh-extraction-accessibility-audit.json
            dist/fresh-extraction-keyboard-audit.json
            dist/fresh-extraction-restart-recovery-audit.json
            dist/fresh-extraction-research-demo-audit.json
            dist/fresh-extraction-walk-forward-package-smoke-report.json
            dist/fresh-extraction-walk-forward-origin-package-smoke-report.json
            dist/fresh-extraction-external-uia-audit.json
            dist/fresh-extraction-verification.json
            dist/nvda-evidence-package-smoke.json
            dist/nvda-evidence-packaged-template.json
            dist/nvda-evidence-fresh-extracted-template.json
          if-no-files-found: error
      - name: Download exact uploaded candidate for publication identity proof
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload_prehuman_candidate.outputs.artifact-id }}
          path: .uploaded-prehuman-proof
      - name: Verify GitHub-stored release ZIP identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expected = [string]$env:AUTOSPORT_QUALIFIED_PACKAGE_SHA256
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw 'Publication proof is missing canonical qualified release ZIP SHA-256' }
          $proofRoot = Join-Path $PWD '.uploaded-prehuman-proof'
          $uploadedPackages = @(Get-ChildItem -LiteralPath $proofRoot -Recurse -Filter 'Autosport-V1-windows-x64.zip' -File)
          if ($uploadedPackages.Count -ne 1) { throw "Publication proof expected exactly one uploaded release ZIP, found $($uploadedPackages.Count)" }
          $uploadedSha = (Get-FileHash -LiteralPath $uploadedPackages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($uploadedSha -ne $expected) {
            throw "GitHub-stored release ZIP SHA-256 mismatch: expected $expected, got $uploadedSha"
          }
