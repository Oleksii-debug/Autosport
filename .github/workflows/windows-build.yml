name: Windows candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'WINDOWS_START_HERE.txt'
      - 'scripts/**'
      - '.gitattributes'
      - '.github/workflows/windows-build.yml'

concurrency:
  group: windows-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      AUTOSPORT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Audit packaged research demo path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $preAudit = Join-Path $PWD 'dist/research-demo-audit.json'
          if (Test-Path $preAudit) { Remove-Item -Force $preAudit }
          $preProcess = Start-Process -FilePath (Join-Path $PWD 'dist/Autosport.exe') -ArgumentList '--research-demo-audit-output', $preAudit, (Join-Path $PWD 'examples/tt_demo') -Wait -PassThru
          if ($preProcess.ExitCode -ne 0) { throw "Packaged research demo audit exited $($preProcess.ExitCode)" }
          $preEvidence = Get-Content $preAudit -Raw | ConvertFrom-Json
          if ($preEvidence.status -ne 'PASS') { throw 'Packaged research demo audit did not PASS' }
          if ($preEvidence.strategy_id -ne 'research-replay-v1') { throw 'Packaged research demo audit strategy mismatch' }
          if ($preEvidence.replay_event_count -ne 4 -or $preEvidence.settled_ticket_count -ne 1 -or $preEvidence.persistent_ticket_count -ne 1) {
            throw 'Packaged research demo audit product journey drifted'
          }
          if ($preEvidence.persistent_balance -ne '990' -or $preEvidence.paper_net_profit -ne '-10') {
            throw 'Packaged research demo audit economic result drifted'
          }
          if ($preEvidence.sample_fixture -ne $true -or $preEvidence.real_historical_market_proof -ne $false -or $preEvidence.profitability_claim -ne $false) {
            throw 'Packaged research demo audit violated sample/historical truth boundary'
          }
          if ($preEvidence.real_money_execution -ne $false -or $preEvidence.human_tested -ne $false -or $preEvidence.nvda_verified -ne $false) {
            throw 'Packaged research demo audit violated release truth labels'
          }

          $freshRoot = Join-Path $PWD '.build-fresh-extraction/Autosport-V1'
          $freshExe = Join-Path $freshRoot 'Autosport.exe'
          $freshDemo = Join-Path $freshRoot 'examples/tt_demo'
          if (-not (Test-Path $freshExe -PathType Leaf)) { throw 'Fresh extraction is missing Autosport.exe for research demo audit' }
          if (-not (Test-Path (Join-Path $freshDemo 'research_plan.json') -PathType Leaf)) { throw 'Fresh extraction is missing shipped research plan' }

          $freshAudit = Join-Path $PWD 'dist/fresh-extraction-research-demo-audit.json'
          if (Test-Path $freshAudit) { Remove-Item -Force $freshAudit }
          $freshProcess = Start-Process -FilePath $freshExe -ArgumentList '--research-demo-audit-output', $freshAudit, $freshDemo -Wait -PassThru
          if ($freshProcess.ExitCode -ne 0) { throw "Fresh-extracted research demo audit exited $($freshProcess.ExitCode)" }
          $freshEvidence = Get-Content $freshAudit -Raw | ConvertFrom-Json
          if ($freshEvidence.status -ne 'PASS') { throw 'Fresh-extracted research demo audit did not PASS' }
          if ($freshEvidence.strategy_id -ne 'research-replay-v1') { throw 'Fresh-extracted research demo strategy mismatch' }
          if ($freshEvidence.research_plan_sha256 -ne $preEvidence.research_plan_sha256) { throw 'Research plan identity changed after packaging' }
          if ($freshEvidence.dataset_market_sha256 -ne $preEvidence.dataset_market_sha256 -or $freshEvidence.dataset_results_sha256 -ne $preEvidence.dataset_results_sha256) {
            throw 'Research demo dataset identity changed after packaging'
          }
          if ($freshEvidence.replay_event_count -ne $preEvidence.replay_event_count -or $freshEvidence.settled_ticket_count -ne $preEvidence.settled_ticket_count -or $freshEvidence.persistent_ticket_count -ne $preEvidence.persistent_ticket_count) {
            throw 'Research demo journey changed after fresh extraction'
          }
          if ($freshEvidence.persistent_balance -ne $preEvidence.persistent_balance -or $freshEvidence.paper_net_profit -ne $preEvidence.paper_net_profit) {
            throw 'Research demo economic result changed after fresh extraction'
          }
          if ($freshEvidence.sample_fixture -ne $true -or $freshEvidence.real_historical_market_proof -ne $false -or $freshEvidence.profitability_claim -ne $false) {
            throw 'Fresh-extracted research demo audit violated sample/historical truth boundary'
          }
          if ($freshEvidence.real_money_execution -ne $false -or $freshEvidence.human_tested -ne $false -or $freshEvidence.nvda_verified -ne $false) {
            throw 'Fresh-extracted research demo audit violated release truth labels'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Autosport-V1-Windows-prehuman
          path: |
            dist/Autosport-V1-windows-x64.zip
            dist/packaged-diagnostic.json
            dist/accessibility-audit.json
            dist/keyboard-audit.json
            dist/restart-recovery-audit.json
            dist/research-demo-audit.json
            dist/package-verification.json
            dist/fresh-extraction-diagnostic.json
            dist/fresh-extraction-accessibility-audit.json
            dist/fresh-extraction-keyboard-audit.json
            dist/fresh-extraction-restart-recovery-audit.json
            dist/fresh-extraction-research-demo-audit.json
            dist/fresh-extraction-verification.json
          if-no-files-found: error
