# Deliberate one-shot source-pinned Windows candidate lane.
# Never runs on PRs, normal main push churn, or external forks.
# The branch must point to a commit already contained in canonical main.
name: Windows exact-main release candidate

on:
  push:
    branches:
      - 'release-candidate/**'

permissions:
  contents: read

concurrency:
  group: autosport-pinned-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-and-package:
    if: github.repository == 'Oleksii-debug/Autosport'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AUTOSPORT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exactly the candidate SHA with complete Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed unless candidate is already integrated in main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:AUTOSPORT_SOURCE_SHA) {
            throw 'Exact candidate Git HEAD mismatch'
          }
          & git rev-parse --verify refs/remotes/origin/main | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Canonical main reference is unavailable' }
          & git merge-base --is-ancestor $env:AUTOSPORT_SOURCE_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source SHA is not a canonical main ancestor' }

      - name: Install pinned test interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify exact tracked checkout
        shell: pwsh
        run: python scripts/verify_source_checkout.py --source-sha $env:AUTOSPORT_SOURCE_SHA

      - name: Install canonical test dependencies
        shell: pwsh
        run: python -m pip install -e '.[test]'

      - name: Execute full repository test suite before candidate shortcut
        shell: pwsh
        run: |
          python -m pytest -v tests
          if ($LASTEXITCODE -ne 0) { throw 'Full exact-SHA pytest gate failed' }

      - name: Build official Windows product and run package safety checks
        shell: pwsh
        run: ./scripts/build_windows_candidate.ps1

      - name: Verify official ZIP and independent extraction are tied to exact SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'dist/Autosport-V1-windows-x64.zip'
          $proof = Join-Path $PWD 'dist/fresh-extraction-verification.json'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'Official Windows ZIP is missing' }
          if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) { throw 'Independent extraction proof is missing' }
          $verified = Get-Content -LiteralPath $proof -Raw | ConvertFrom-Json
          if ([string]$verified.status -ne 'PASS') { throw 'Independent extraction not PASS' }
          if ([string]$verified.source_sha -ne $env:AUTOSPORT_SOURCE_SHA) { throw 'Extracted candidate SHA mismatch' }
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne [string]$verified.package_sha256) { throw 'ZIP SHA-256 mismatches independent extraction proof' }
          if ($verified.real_money_execution -eq $true -or $verified.human_tested -eq $true -or $verified.nvda_verified -eq $true) {
            throw 'Prehuman package must not claim real money or physical acceptance'
          }
          Write-Host "PREHUMAN_EXACT_MAIN_PACKAGE=PASS source_sha=$env:AUTOSPORT_SOURCE_SHA sha256=$digest"

      - name: Upload verified prehuman Windows ZIP and independent evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Autosport-V1-Windows-prehuman-pinned-${{ github.sha }}
          path: |
            dist/Autosport-V1-windows-x64.zip
            dist/fresh-extraction-verification.json
            dist/package-verification.json
          if-no-files-found: error
          retention-days: 14
