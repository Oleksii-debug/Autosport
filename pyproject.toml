[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosport-lab"
version = "0.1.0"
description = "Windows-first agentic sports-market replay and paper-simulation laboratory"
requires-python = ">=3.11"
dependencies = ["tk-uia==0.8.0"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
autosport = "autosport.cli:main"
autosport-build-historical-corpus = "autosport.historical_corpus:main"
autosport-capture-historical-matches = "autosport.historical_matches:main"
autosport-acquire-historical-evidence = "autosport.historical_acquisition:main"

[tool.setuptools.packages.find]
where = ["src"]
