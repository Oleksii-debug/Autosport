[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autosport-lab"
version = "0.0.1"
description = "Autosport multi-agent sports market replay and paper simulation laboratory"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
windows = ["pywebview>=6,<7"]
data = ["duckdb>=1.3,<2", "polars>=1.30,<2"]
dev = []

[project.scripts]
autosport = "autosport.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
