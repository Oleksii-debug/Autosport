[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosport-lab"
version = "0.1.0"
description = "Windows-first agentic sports-market intelligence, paper-proof and portfolio platform"
requires-python = ">=3.11"
dependencies = ["tk-uia==0.8.0", "APScheduler==3.11.3"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
test = ["pytest>=8,<9"]

[project.scripts]
autosport = "autosport.cli:main"
autosport-observe-continuous = "autosport.continuous_observation:main"
autosport-export-evidence = "autosport.evidence_export:main"
autosport-verify-evidence = "autosport.evidence_export:verify_main"
autosport-build-historical-corpus = "autosport.historical_governance:corpus_main"
autosport-build-historical-corpus-from-bundle = "autosport.historical_governance:bundle_corpus_main"
autosport-capture-historical-matches = "autosport.historical_matches:main"
autosport-acquire-historical-evidence = "autosport.historical_acquisition:main"

[tool.setuptools.packages.find]
where = ["src"]
